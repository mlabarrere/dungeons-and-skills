name: publish GitHub beta

on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing beta tag to verify or publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run skill:check
      - run: npm test
      - run: node scripts/build-public-release.mjs --source . --output "$RUNNER_TEMP/release"
      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "$RUNNER_TEMP/release/dungeons-and-skills-${RELEASE_TAG}.zip"
            "$RUNNER_TEMP/release/dungeons-and-skills-${RELEASE_TAG}.tar.gz"
            "$RUNNER_TEMP/release/SHA256SUMS"
            "$RUNNER_TEMP/release/release-manifest.json"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            downloaded="$RUNNER_TEMP/existing-release"
            mkdir "$downloaded"
            gh release download "$RELEASE_TAG" --dir "$downloaded"
            for asset in "${assets[@]}"; do
              cmp --silent "$asset" "$downloaded/$(basename "$asset")" || {
                echo "::error::Published asset differs from the reproducible build: $(basename "$asset")"
                exit 1
              }
            done
            echo "Existing immutable release matches the reproducible build."
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --prerelease --generate-notes --verify-tag
          fi
